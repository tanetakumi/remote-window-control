<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Share App Remote</title>
  </head>
  <body>
    <div class="ambient-glow ambient-glow-1" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-2" aria-hidden="true"></div>

    <div id="app">
      <!-- Window Selection Screen -->
      <main id="select-screen">
        <div class="select-container">
          <header class="select-header">
            <h1 class="brand-title">Application</h1>
            <div class="header-actions">
              <button id="keepalive-button" type="button" aria-pressed="false" aria-label="Keep the session display alive" title="Keep the session display alive">
                <span id="keepalive-dot" data-state="off" aria-hidden="true"></span>
                <span>Keep alive</span>
              </button>
              <button id="refresh-button" type="button" aria-label="Refresh window list">
                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                  <path d="M21 3v5h-5"></path>
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                  <path d="M8 16H3v5"></path>
                </svg>
                <span>Refresh</span>
              </button>
              <button id="settings-button" type="button" aria-label="Open settings" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </header>

          <p id="select-status" role="status" aria-live="polite"></p>

          <div id="window-list" role="region" aria-label="Available windows"></div>
        </div>
      </main>

      <!-- Settings Screen -->
      <main id="settings-screen" hidden>
        <div class="select-container">
          <header class="select-header">
            <h1 class="brand-title">Settings</h1>
            <div class="header-actions">
              <button id="settings-back" type="button" aria-label="Back to applications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg>
                <span>Back</span>
              </button>
            </div>
          </header>

          <p id="settings-status" role="status" aria-live="polite"></p>

          <div class="settings-field settings-slider">
            <label for="settings-fps">Video FPS</label>
            <output id="settings-fps-value" for="settings-fps"></output>
            <input id="settings-fps" type="range" min="1" max="30" step="1" />
          </div>
          <div class="settings-field settings-slider">
            <label for="settings-crf">Video quality CRF (lower is sharper)</label>
            <output id="settings-crf-value" for="settings-crf"></output>
            <input id="settings-crf" type="range" min="0" max="63" step="1" />
          </div>
          <div class="settings-field settings-slider">
            <label for="settings-scale">Max window scale (pixels per CSS pixel)</label>
            <output id="settings-scale-value" for="settings-scale"></output>
            <input id="settings-scale" type="range" min="0.5" max="4" step="0.25" />
          </div>
          <div class="settings-field settings-slider">
            <label for="settings-scroll">Scroll sensitivity (higher is faster)</label>
            <output id="settings-scroll-value" for="settings-scroll"></output>
            <input id="settings-scroll" type="range" min="0.5" max="4" step="0.25" />
          </div>
          <button id="settings-save" type="button" disabled>Save</button>
        </div>
      </main>

      <!-- Remote Control Screen -->
      <div id="remote-screen" hidden>
        <header id="top-bar">
          <button id="windows-button" type="button" aria-label="Back to applications" title="Back to applications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg>
          </button>
          <div class="status-group">
            <span id="status-message" class="sr-only" role="status" aria-live="polite" aria-atomic="true">Connecting…</span>
            <div id="bitrate-pill" hidden><span class="bitrate-value"></span><span class="bitrate-unit">kbps</span></div>
          </div>
          <div id="top-bar-actions">
            <button id="input-mode-button" type="button" aria-label="PC control: off. Switch to PC mode" aria-pressed="false" title="Switch to PC mode" disabled>
              <svg class="input-window-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6 6.5h.01M9 6.5h.01"/></svg>
              <svg class="input-pc-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              <span class="mode-label">Window</span>
            </button>
            <div id="touch-mode" role="group" aria-label="Input mode">
              <button type="button" data-mode="direct" aria-label="Tap mode: touch the screen directly" aria-pressed="false" title="Tap: touch the screen directly" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 12V5a2 2 0 0 1 4 0v7M13 9h2a2 2 0 0 1 2 2h1a2 2 0 0 1 2 2v3a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.8-2.4l-4-5.3a2 2 0 0 1 3-2.6L9 14M5 3 4 2M17 3l1-1M3 7H2M20 7h-1"/>
                </svg>
                <span class="mode-label">Tap</span>
              </button>
              <button type="button" data-mode="relative" aria-label="Pointer mode: slide to move the cursor" aria-pressed="true" title="Pointer: slide to move the cursor" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 3 7.5 18 2.5-7 7-2.5L4 3zM14 14l6 6"/></svg>
                <span class="mode-label">Pointer</span>
              </button>
            </div>
            <button id="keyboard-button" type="button" aria-label="Open text input" aria-haspopup="dialog" aria-controls="text-dialog" aria-expanded="false" title="Text input" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 14.5zM7 9H6m4 0H9m4 0h-1m4 0h-1m-8 3H6m4 0H9m4 0h-1m4 0h-1m-8 3h10"/>
              </svg>
            </button>
            <button id="special-keys-button" type="button" aria-label="Special keys" aria-controls="special-keys-palette" aria-expanded="false" aria-pressed="false" title="Special keys" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
              </svg>
            </button>
          </div>
        </header>

        <div id="video-stage">
          <div id="video-waiting" role="status">
            <div class="radar-pulse"></div>
            <p class="waiting-text">Waiting for host video stream…</p>
          </div>
          <video
            id="remote-video"
            autoplay
            playsinline
            muted
            disablepictureinpicture
          ></video>
          <div id="touch-cursor" aria-hidden="true" hidden>
            <svg viewBox="0 0 24 30">
              <path d="M1 1v23l6-6 5 10 4-2-5-10h10z"/>
            </svg>
          </div>
          <div id="special-keys-palette" role="group" aria-label="Special keys" hidden>
            <button id="move-special-keys-palette" type="button" aria-label="Move special keys palette: drag or use arrow keys" title="Drag to move, or use arrow keys" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="8" cy="5" r="1.5"/><circle cx="16" cy="5" r="1.5"/>
                <circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/>
                <circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/>
              </svg>
            </button>
            <div class="special-keys-grid">
              <button id="send-backspace" type="button" aria-label="Send Backspace to remote window" title="Backspace" disabled>BS</button>
              <button id="send-shift-enter" type="button" aria-label="Send Shift+Enter to remote window" title="Shift+Enter (new line)" disabled>⇧↵</button>
              <button id="send-arrow-up" type="button" aria-label="Send ArrowUp to remote window" title="Arrow Up" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
              </button>
              <button id="send-arrow-left" type="button" aria-label="Send ArrowLeft to remote window" title="Arrow Left" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
              </button>
              <button id="send-arrow-down" type="button" aria-label="Send ArrowDown to remote window" title="Arrow Down" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <button id="send-arrow-right" type="button" aria-label="Send ArrowRight to remote window" title="Arrow Right" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
              </button>
            </div>
          </div>
          <div id="remote-notice" hidden>
            <span id="remote-notice-message"></span>
            <button id="dismiss-notice" class="dismiss-button" type="button" aria-label="Dismiss message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>

        <dialog id="text-dialog" aria-labelledby="text-dialog-title">
          <div class="text-dialog-header">
            <label id="text-dialog-title" for="remote-text-input">Text input</label>
            <button id="close-text-input" class="dismiss-button" type="button" aria-label="Close text input">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <textarea
            id="remote-text-input"
            rows="4"
            inputmode="text"
            enterkeyhint="enter"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Type here, then send…"
            aria-describedby="text-input-error"
          ></textarea>
          <p id="text-input-error" role="status" hidden></p>
          <div class="text-dialog-actions">
            <button id="restore-text-input" type="button" hidden>Restore last text</button>
            <button id="send-text-input" type="button" disabled>Send</button>
          </div>
        </dialog>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
