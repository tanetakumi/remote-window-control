<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Share App Remote</title>
  </head>
  <body>
    <div class="ambient-glow ambient-glow-1" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-2" aria-hidden="true"></div>

    <div id="app">
      <!-- Window Selection Screen -->
      <main id="select-screen">
        <div class="select-container">
          <header class="select-header">
            <h1 class="brand-title">Application</h1>
            <button id="refresh-button" type="button" aria-label="Refresh window list">
              <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M8 16H3v5"></path>
              </svg>
              <span>Refresh</span>
            </button>
          </header>

          <p id="select-status" role="status" aria-live="polite"></p>

          <div id="window-list" role="region" aria-label="Available windows"></div>
        </div>
      </main>

      <!-- Remote Control Screen -->
      <div id="remote-screen" hidden>
        <header id="top-bar">
          <div class="status-group">
            <div id="status-pill" role="status" aria-live="polite">Connecting…</div>
            <div id="bitrate-pill" hidden aria-label="Video bitrate"></div>
          </div>
          <div id="top-bar-actions">
            <button id="windows-button" type="button" aria-label="Switch window" title="Switch window">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/></svg>
            </button>
            <button id="touch-mode" type="button" aria-label="Input mode: Pointer. Switch to Tap." title="Switch to Tap mode" disabled>Pointer</button>
            <button id="keyboard-button" type="button" aria-label="Toggle keyboard" title="Keyboard">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 14.5zM7 9H6m4 0H9m4 0h-1m4 0h-1m-8 3H6m4 0H9m4 0h-1m4 0h-1m-8 3h10"/>
              </svg>
            </button>
          </div>
        </header>

        <div id="video-stage">
          <div id="video-waiting" role="status">
            <div class="radar-pulse"></div>
            <p class="waiting-text">Waiting for host video stream…</p>
          </div>
          <video
            id="remote-video"
            autoplay
            playsinline
            muted
            disablepictureinpicture
          ></video>
          <div id="touch-cursor" aria-hidden="true" hidden>
            <svg viewBox="0 0 24 30">
              <path d="M1 1v23l6-6 5 10 4-2-5-10h10z"/>
            </svg>
          </div>
        </div>

        <div id="input-dock">
          <div class="input-wrapper">
            <textarea
              id="hidden-text-input"
              inputmode="text"
              enterkeyhint="done"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="Type into remote window…"
            ></textarea>
          </div>
          <button id="backspace-button" type="button" aria-label="Backspace" title="Backspace">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 6h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-9L3 12zm4 3-4 6m0-6 4 6"/>
            </svg>
          </button>
          <button id="enter-button" type="button" aria-label="Enter" title="Enter">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7v6a3 3 0 0 0 3 3h13m0 0-4-4m4 4-4 4"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
