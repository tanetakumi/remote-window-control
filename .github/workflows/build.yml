name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install FFmpeg cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools nasm make pkg-config curl xz-utils
      - name: Build pinned LGPL FFmpeg and corresponding sources
        run: bash scripts/ffmpeg/build.sh
      - name: Upload FFmpeg with source bundle
        uses: actions/upload-artifact@v4
        with:
          name: share-app-ffmpeg
          path: |
            dist/ffmpeg/package/
            dist/ffmpeg/*-share-app-sources.tar.gz
            dist/ffmpeg/sources.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  build:
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web-ui/package.json
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: control-server/go.mod
          cache-dependency-path: control-server/go.sum
      - name: Download bundled FFmpeg and corresponding sources
        uses: actions/download-artifact@v4
        with:
          name: share-app-ffmpeg
          path: dist/ffmpeg
      - name: Build and test
        env:
          CHECK_ONLY: ${{ github.event_name == 'pull_request' }}
        run: |
          if ($env:CHECK_ONLY -eq 'true') {
            node scripts/build.mjs --check
          } else {
            node scripts/build.mjs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer, ZIP, sources and checksums
        if: github.event_name != 'pull_request'
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: ./installer/build.ps1 -Version $env:PACKAGE_VERSION
      - name: Smoke test install, upgrade and uninstall
        if: github.event_name != 'pull_request'
        run: |
          $installers = @(Get-ChildItem dist/releases/*-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          ./installer/test.ps1 -InstallerPath $installers[0].FullName
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: share-app-windows-packages
          path: dist/releases/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: share-app-windows-packages
          path: dist/releases
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: dist/releases/RELEASE-NOTES.md
          files: |
            dist/releases/*-Setup.exe
            dist/releases/*-windows-x64.zip
            dist/releases/*-share-app-sources.tar.gz
            dist/releases/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
